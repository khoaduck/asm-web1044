<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên Hệ | VOLT</title>
    <link
      href="[https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap)"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">V O L T</a>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="san-pham.html">Tất Cả Sản Phẩm</a></li>
            <li><a href="lien-he.html" class="active">Liên Hệ</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a href="gio-hang.html" class="cart-icon-btn">🛒 <span class="cart-badge">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section" style="max-width: 800px">
      <div class="section-label" style="text-align: center">GỬI THÔNG TIN</div>
      <h1 class="section-title" style="text-align: center">Liên Hệ Với Chúng Tôi</h1>

      <form
        id="contact-form"
        style="background: white; padding: 36px; border-radius: 16px; margin-top: 24px"
        novalidate
      >
        <div class="form-group">
          <label for="fullname">Họ và tên *</label>
          <input type="text" id="fullname" class="form-control" placeholder="Nguyễn Văn A" />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="email">Địa chỉ Email *</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" class="form-control" placeholder="0912345678" />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label for="message">Nội dung liên hệ *</label>
          <textarea
            id="message"
            class="form-control"
            rows="5"
            placeholder="Bạn cần trợ giúp gì?"
          ></textarea>
          <span class="error-message"></span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px">
          GỬI THÔNG TIN
        </button>
      </form>
    </main>

    <footer class="site-footer">
      <div class="copyright">© 2026 VOLT Store.</div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/validate.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        setupContactValidation("contact-form");
      });
    </script>
  </body>
</html>
