<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Mục Sản Phẩm | VOLT</title>
    <link
      href="[https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap)"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">V O L T</a>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="san-pham.html" class="active">Tất Cả Sản Phẩm</a></li>
            <li><a href="san-pham.html?cat=dien-thoai">Điện Thoại</a></li>
            <li><a href="san-pham.html?cat=laptop">Laptop</a></li>
            <li><a href="san-pham.html?cat=am-thanh">Âm Thanh</a></li>
            <li><a href="san-pham.html?cat=phu-kien">Phụ Kiện</a></li>
            <li><a href="lien-he.html">Liên Hệ</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <form id="header-search-form" class="search-box">
            <input type="text" id="header-search-input" placeholder="Tìm sản phẩm..." />
            <button type="submit">🔍</button>
          </form>
          <a href="gio-hang.html" class="cart-icon-btn">🛒 <span class="cart-badge">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          margin-bottom: 24px;
          border-bottom: 1px solid var(--border-color);
          padding-bottom: 16px;
        "
      >
        <div>
          <span class="section-label">DANH MỤC</span>
          <h1 id="category-title" class="section-title" style="margin-bottom: 0">
            Tất Cả Sản Phẩm
          </h1>
          <span id="product-count" style="color: var(--text-secondary); font-size: 0.9rem"></span>
        </div>
        <div>
          <label for="sort-select" style="font-size: 0.85rem; font-weight: 600">SẮP XẾP: </label>
          <select
            id="sort-select"
            class="form-control"
            style="width: auto; display: inline-block; padding: 6px 12px"
          >
            <option value="default">Mặc định</option>
            <option value="price-asc">Giá: Thấp đến Cao</option>
            <option value="price-desc">Giá: Cao đến Thấp</option>
          </select>
        </div>
      </div>

      <div id="category-product-grid" class="product-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div class="footer-col">
          <a href="index.html" class="logo" style="color: white">V O L T</a>
          <p style="margin-top: 12px; color: #aaa">Thương hiệu thiết bị công nghệ cao cấp.</p>
        </div>
        <div class="footer-col">
          <h4>DANH MỤC</h4>
          <ul>
            <li><a href="san-pham.html?cat=dien-thoai">Điện thoại</a></li>
            <li><a href="san-pham.html?cat=laptop">Laptop</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>HỖ TRỢ</h4>
          <ul>
            <li><a href="lien-he.html">Liên hệ</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>LIÊN HỆ</h4>
          <p style="color: #aaa">Hotline: 1900 1234</p>
        </div>
      </div>
      <div class="copyright">© 2026 VOLT Store.</div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
