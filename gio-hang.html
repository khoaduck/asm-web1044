<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng | VOLT</title>
    <link
      href="[https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap)"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">V O L T</a>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="san-pham.html">Tất Cả Sản Phẩm</a></li>
            <li><a href="lien-he.html">Liên Hệ</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a href="gio-hang.html" class="cart-icon-btn">🛒 <span class="cart-badge">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div class="section-label">XEM LẠI ĐƠN HÀNG</div>
      <h1 class="section-title">Giỏ Hàng Của Bạn</h1>

      <!-- Thông báo khi giỏ hàng trống -->
      <div id="empty-cart-msg" style="display: none; text-align: center; padding: 60px 0">
        <p style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 20px">
          Giỏ hàng của bạn đang trống.
        </p>
        <a href="san-pham.html" class="btn btn-primary">MUA SẮM NGAY</a>
      </div>

      <!-- Nội dung giỏ hàng -->
      <div id="cart-content-wrapper">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đơn giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="cart-table-body"></tbody>
        </table>

        <div id="cart-summary-box" class="cart-summary"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="copyright">© 2026 VOLT Store.</div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
